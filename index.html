  --bg:#070707; --fg:#f5f5f5; --card:#141414; --muted:#1f1f1f; --muted-fg:#8f8f8f;
  --primary:#00d4d5; --primary-fg:#000f10; --accent:#ffc31a; --success:#3fc168;
  --destructive:#f1383e; --border:rgba(255,255,255,.09); --ink:#0e7490;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
html,body{margin:0;min-height:100%}
body{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(180deg,#0e7490 0%,rgba(14,116,144,.45) 55%,transparent 100%);color:var(--fg);padding:22px 16px 48px;padding-top:max(22px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:28px;height:28px;object-fit:contain;background:var(--card);border-radius:8px;padding:2px;border:1px solid var(--border)}
.brand b{font-size:11px;letter-spacing:.2em;font-weight:700;opacity:.6;text-transform:uppercase}
.brand small{display:block;color:var(--primary);font-size:12px;letter-spacing:0;opacity:1;margin-top:2px;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.nav button{background:rgba(0,212,213,.15);color:var(--primary);border:1px solid var(--border);border-radius:12px;width:40px;height:36px;font-size:18px;font-weight:700}
.nav div{text-align:center;font-weight:800;font-size:22px;letter-spacing:-.02em}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .4s;border-radius:99px}
.prog{font-size:12px;margin-top:8px;color:rgba(245,245,245,.7)}
main{position:relative;padding:0 12px 110px;margin-top:-28px}
svg.trail{position:absolute;left:0;top:0;pointer-events:none}
.end{text-align:center;font-weight:700;font-size:14px;margin:6px 0 24px}
.end span{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 16px;box-shadow:var(--shadow);color:var(--muted-fg)}
.stop{display:flex;align-items:center;gap:12px;margin:0 0 26px;position:relative}
.stop.r{flex-direction:row-reverse}
.dot{flex:0 0 46px;height:46px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid var(--card);box-shadow:0 2px 8px #0008;z-index:2;background:var(--muted)}
.done .dot{background:var(--success)!important;font-size:20px;color:#041}
.card{flex:1;background:var(--card);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border);border-left:4px solid var(--primary);box-shadow:var(--shadow);position:relative;min-width:0}
.card .t{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg)}
.card h3{margin:4px 0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.card p{margin:0;font-size:13px;color:var(--muted-fg);padding-right:28px}
.done .card{opacity:.55}
.done .card h3{text-decoration:line-through}
.next .card{box-shadow:0 0 0 2px var(--primary),0 10px 30px rgba(0,212,213,.25);border-left-color:var(--primary)}
.next .dot{background:var(--primary)!important;color:var(--primary-fg);animation:p 1.4s infinite}
.next .card:after{content:"PRÓXIMA";position:absolute;top:-9px;right:10px;background:var(--primary);color:var(--primary-fg);font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;letter-spacing:.06em}
@keyframes p{50%{transform:scale(1.1)}}
.ed{position:absolute;bottom:6px;right:8px;border:0;background:var(--muted);color:var(--fg);border-radius:8px;font-size:14px;padding:3px 7px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:4px 16px 100px;font-size:12px;color:var(--muted-fg)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--primary);color:var(--primary-fg);font-size:28px;font-weight:800;box-shadow:0 10px 30px rgba(0,212,213,.35);z-index:6}
.bottom{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:6px;background:rgba(20,20,20,.95);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bottom button{flex:1;background:transparent;border:0;color:var(--muted-fg);border-radius:12px;padding:10px 4px;font-size:11px;font-weight:600;font-family:inherit}
.bottom button.on{background:rgba(0,212,213,.15);color:var(--primary)}

/* —— Bottom sheet —— */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s ease}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border:1px solid var(--border);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.55);padding:0 16px calc(16px + env(safe-area-inset-bottom));max-height:min(92vh,720px);overflow:auto;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
.sheet.open{transform:translateY(0)}
.sheet .handle{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:10px auto 14px}
.sheet h3{margin:0 0 18px;font-size:20px;font-weight:800;letter-spacing:-.02em;text-align:center}
.field{margin:0 0 14px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg);margin:0 0 6px}
.field input,.field textarea{width:100%;background:var(--muted);color:var(--fg);border:1px solid var(--border);border-radius:12px;padding:14px 14px;font-size:16px;font-family:inherit;outline:none;caret-color:var(--primary)}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,212,213,.18)}
.field textarea{min-height:72px;resize:vertical;line-height:1.4}
.field-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.field-row label{margin:0}
.manage{background:none;border:0;color:var(--primary);font-size:12px;font-weight:700;font-family:inherit;padding:4px 0;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--muted);border:1.5px solid var(--border);color:var(--fg);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip .dotc{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.chip.on{background:rgba(0,212,213,.14);border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 1px rgba(0,212,213,.25)}
.chip.add{border-style:dashed;color:var(--muted-fg)}
.chip.add.on,.chip.add:hover{color:var(--primary);border-color:var(--primary)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:14px;border:0;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:-.01em}
.btn-primary{background:var(--primary);color:var(--primary-fg);box-shadow:0 8px 24px rgba(0,212,213,.3)}
.btn-ghost{background:transparent;color:var(--muted-fg);border:1px solid var(--border)}
.btn-danger{background:rgba(241,56,62,.12);color:var(--destructive);border:1px solid rgba(241,56,62,.25)}
.btn-danger[hidden],.btn[hidden]{display:none!important}

/* —— New category mini-form —— */
.cat-form{display:none;margin:4px 0 14px;padding:14px;background:var(--muted);border:1px solid var(--border);border-radius:14px}
.cat-form.open{display:block}
.cat-form .swatches{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--primary)}
.emoji-row{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.emoji-row button{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:18px;cursor:pointer;padding:0}
.emoji-row button.on{border-color:var(--primary);background:rgba(0,212,213,.12)}
.cat-form .row2{display:flex;gap:8px}
.cat-form .row2 .btn{height:44px;font-size:14px}

/* —— Manage categories sheet —— */
.cat-list{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--muted);border:1px solid var(--border);border-radius:12px}
.cat-item .dotc{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
.cat-item .name{flex:1;font-weight:700;font-size:14px;min-width:0}
.cat-item .tag{font-size:10px;color:var(--muted-fg);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cat-item button{border:0;background:var(--card);color:var(--fg);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.cat-item button.del{color:var(--destructive)}
.empty{text-align:center;color:var(--muted-fg);padding:28px 12px;font-size:14px}

<div class="nav"><button id="prev">‹</button><div id="dt"></div><button id="nxt">›</button></div>
<div class="bar"><i id="pb"></i></div><div class="prog" id="pt"></div></header>
<main id="m"></main>
<div class="legend" id="legend"></div>
<button class="fab" id="add" aria-label="Nova parada">+</button>

<div class="backdrop" id="bd"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="fh">
  <div class="handle"></div>
  <h3 id="fh">Nova parada</h3>
  <form id="f" autocomplete="off">
    <div class="field">
      <label for="fh_h">Horário</label>
      <input type="time" id="fh_h" name="h" required>
    </div>
    <div class="field">
      <label for="fh_t">Título</label>
      <input type="text" id="fh_t" name="t" required placeholder="Ex.: Entregar no Soares" maxlength="80">
    </div>
    <div class="field">
      <label for="fh_d">Detalhe <span style="opacity:.6;font-weight:600;letter-spacing:0;text-transform:none">(opcional)</span></label>
      <textarea id="fh_d" name="d" placeholder="Endereço, valor, observação…" maxlength="200"></textarea>
    </div>
    <div class="field">
      <div class="field-row">
        <label>Categoria</label>
        <button type="button" class="manage" id="btnManage">Gerenciar</button>
      </div>
      <div class="chips" id="chips"></div>
      <input type="hidden" name="k" id="fh_k" value="vendas">
      <div class="cat-form" id="catForm">
        <label style="display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg);margin:0 0 6px">Nova categoria</label>
        <input type="text" id="catNome" placeholder="Nome da categoria" maxlength="24" style="width:100%;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;margin-bottom:8px">
        <div class="swatches" id="swatches"></div>
        <div class="emoji-row" id="emojis"></div>
        <div class="row2">
          <button type="button" class="btn btn-ghost" id="catCancel">Cancelar</button>
          <button type="button" class="btn btn-primary" id="catSave">Salvar</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary" id="btnSave">Salvar parada</button>
      <button type="button" class="btn btn-ghost" id="can">Cancelar</button>
      <button type="button" class="btn btn-danger" id="del" hidden>Excluir</button>
    </div>
  </form>
</div>

<div class="backdrop" id="bd2"></div>
<div class="sheet" id="sheetCat" role="dialog" aria-modal="true">
  <div class="handle"></div>
  <h3>Categorias</h3>
  <div class="cat-list" id="catList"></div>
  <div class="actions">
    <button type="button" class="btn btn-primary" id="catAddFromManage">+ Nova categoria</button>
    <button type="button" class="btn btn-ghost" id="catClose">Fechar</button>
  </div>
</div>
<script>
const DEFAULT_CATS=[
  {id:'pagamento',nome:'Pagamento',cor:'#E53935',emoji:'💰',def:true},
  {id:'entrega',nome:'Entrega',cor:'#FB8C00',emoji:'📦',def:true},
  {id:'vendas',nome:'Vendas',cor:'#43A047',emoji:'🛒',def:true},
  {id:'escritorio',nome:'Escritório',cor:'#1E88E5',emoji:'📋',def:true},
  {id:'pausa',nome:'Pausa',cor:'#9E9E9E',emoji:'☕',def:true}
];
const SWATCHES=['#E53935','#FB8C00','#FDD835','#43A047','#00ACC1','#1E88E5','#5E35B1','#EC4899','#8D6E63','#9E9E9E'];
const EMOJIS=['💰','📦','🛒','📋','☕','🚗','📞','⭐','🏠','🧾','🎯','🔧'];
const CAT_KEY='rastro:categorias';
const FALLBACK_COR='#9E9E9E';

function loadCats(){
  try{
    const raw=localStorage.getItem(CAT_KEY);
    if(!raw)return DEFAULT_CATS.map(c=>({...c}));
    const arr=JSON.parse(raw);
    if(!Array.isArray(arr)||!arr.length)return DEFAULT_CATS.map(c=>({...c}));
    // merge: ensure defaults exist
    const byId={};
    for(const c of arr){if(c&&c.id)byId[c.id]={id:c.id,nome:c.nome||c.id,cor:c.cor||FALLBACK_COR,emoji:c.emoji||'',def:!!c.def}}
    for(const d of DEFAULT_CATS){if(!byId[d.id])byId[d.id]={...d};else{byId[d.id].def=true}}
    const customs=Object.values(byId).filter(c=>!c.def);
    return [...DEFAULT_CATS.map(d=>({...d,...(byId[d.id]||{}),def:true})),...customs];
  }catch(e){return DEFAULT_CATS.map(c=>({...c}))}
}
function saveCats(arr){localStorage.setItem(CAT_KEY,JSON.stringify(arr))}
let cats=loadCats();
function catById(id){return cats.find(c=>c.id===id)}
function catColor(id){const c=catById(id);return c?c.cor:FALLBACK_COR}
function catNome(id){const c=catById(id);return c?c.nome:id||'Outro'}

const norm=k=>{
  let s=(k||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  s=s.replace('escritório','escritorio').replace(/\s+/g,'_');
  // legacy aliases
  const map={pag:'pagamento',ent:'entrega',ven:'vendas',esc:'escritorio',pau:'pausa',
    pagamento:'pagamento',entrega:'entrega',vendas:'vendas',escritorio:'escritorio',pausa:'pausa'};
  return map[s]||s||'vendas';
};
const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24)||('cat_'+Date.now());

const S=(h,t,d,k)=>({id:h+'|'+t,h,t,d,k,done:false});
const DEF={'2026-11-04':[S('07:30','Cobrir o cheque','Imperial Distribuição, R$ 1.845,37','pagamento'),S('08:00','Revisar pedido','Supermercado Preço Justo','escritorio'),S('08:30','Atualizar metas','Super Clube Colgate','escritorio'),S('09:00','Pegar mercadoria do Deleon','Com o motorista, e cobrar o restante','entrega'),S('09:30','Entregar no Soares','Supermercado Soares','entrega'),S('10:30','Entregar no Deleon','Entrega','entrega'),S('11:30','Visitar o Viana','Tentar vender','vendas'),S('12:30','Almoço','Pausa','pausa'),S('13:30','Rota AC Distribuidora','Atender clientes','vendas'),S('15:30','Rota Multicanal','Fechar 6 clientes no dia','vendas'),S('17:30','Fechamento','Conferir a lista e os boletos de amanhã (R$ 4.201,06)','escritorio')],
'2026-11-05':[S('08:00','Pagar boletos Rio Vermelho','Babysec R$ 2.079,56 + Assim R$ 2.121,50','pagamento')]};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const K=d=>'rastro:'+d;
function load(d){const s=localStorage.getItem(K(d));if(s)return JSON.parse(s);return JSON.parse(JSON.stringify(DEF[d]||[]))}
function save(d,a){localStorage.setItem(K(d),JSON.stringify(a))}
let day=iso(new Date()),list,editing=null,selectedK='vendas';
let pickCor=SWATCHES[0],pickEmoji='⭐',editingCatId=null;

// import ?d=base64(JSON)
(function(){const q=new URLSearchParams(location.search);const raw=q.get('d')||new URLSearchParams(location.hash.slice(1)).get('d');if(!raw)return;
try{let b=raw.replace(/-/g,'+').replace(/_/g,'/').replace(/ /g,'+');while(b.length%4)b+='=';
const j=JSON.parse(decodeURIComponent(escape(atob(b))));let days={};
if(Array.isArray(j))days[q.get('date')||day]=j;else if(j.days)days=j.days;else days[j.date||day]=j.stops||[];
let first;for(const dd in days){first=first||dd;const cur=load(dd);for(const s of days[dd]){const n={h:s.h||s.hora||'',t:s.t||s.titulo||'',d:s.d||s.detalhe||'',k:norm(s.k||s.tipo)||'vendas'};n.id=n.h+'|'+n.t;
const e=cur.find(x=>x.id===n.id||(x.t===n.t&&x.h===n.h));if(e){e.d=n.d;e.k=n.k}else cur.push({...n,done:!!s.done})}save(dd,cur)}
if(first)day=first;history.replaceState(null,'',location.pathname)}catch(e){alert('Link de importação inválido')}})();

const m=document.getElementById('m');
const sheet=document.getElementById('sheet');
const bd=document.getElementById('bd');
const sheetCat=document.getElementById('sheetCat');
const bd2=document.getElementById('bd2');
const F=document.getElementById('f');
const catForm=document.getElementById('catForm');

function renderLegend(){
  document.getElementById('legend').innerHTML=cats.map(c=>`<span><i style="background:${c.cor}"></i>${esc(c.nome)}</span>`).join('');
}
function render(){
  list=load(day).sort((a,b)=>a.h.localeCompare(b.h));
  const dt=new Date(day+'T12:00');
  document.getElementById('dt').textContent=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}).replace(/^./,c=>c.toUpperCase());
  const n=list.length,f=list.filter(x=>x.done).length;
  document.getElementById('pb').style.width=(n?f/n*100:0)+'%';
  document.getElementById('pt').textContent=f+' de '+n+' paradas feitas'+(n&&f===n?' 🎉':'');
  const nx=list.find(x=>!x.done);let h='<div class="end"><span>🏁 Fim do dia</span></div>';
  if(!n)h+='<div class="empty">Nenhuma parada. Toque em + para adicionar.</div>';
  [...list].reverse().forEach((s,ri)=>{const i=n-1-ri,c=catColor(s.k);
  h+=`<div class="stop ${i%2?'r':''} ${s.done?'done':''} ${s===nx?'next':''}" data-i="${i}"><div class="dot" style="background:${c}">${s.done?'✓':i+1}</div><div class="card" style="border-left-color:${c}"><div class="t">${s.h} · ${esc(catNome(s.k))}</div><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p><button class="ed" data-e="${i}" type="button">✏️</button></div></div>`});
  h+='<div class="end" style="margin:0"><span>🏠 Saída</span></div>';
  m.innerHTML=h;renderLegend();requestAnimationFrame(trail);
}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function trail(){m.querySelector('svg')?.remove();const r=m.getBoundingClientRect();const pts=[...m.querySelectorAll('.end span,.dot')].map(e=>{const b=e.getBoundingClientRect();return[b.left+b.width/2-r.left,b.top+b.height/2-r.top]});
if(pts.length<2)return;let d='M'+pts[0];for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[x,y]=pts[i],my=(b+y)/2;d+=` C${a},${my} ${x},${my} ${x},${y}`}
m.insertAdjacentHTML('afterbegin',`<svg class="trail" width="${r.width}" height="${r.height}"><path d="${d}" fill="none" stroke="#00d4d5" stroke-opacity=".28" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round"/></svg>`)}

m.onclick=e=>{const ed=e.target.closest('[data-e]');if(ed){openF(+ed.dataset.e);return}const s=e.target.closest('.stop');if(!s)return;const it=list[+s.dataset.i];it.done=!it.done;save(day,list);navigator.vibrate?.(30);render()};

function renderChips(){
  const box=document.getElementById('chips');
  box.innerHTML=cats.map(c=>`<button type="button" class="chip ${c.id===selectedK?'on':''}" data-k="${c.id}"><span class="dotc" style="background:${c.cor}"></span>${c.emoji?c.emoji+' ':''}${esc(c.nome)}</button>`).join('')
    +`<button type="button" class="chip add" id="chipAdd">+ Nova categoria</button>`;
  box.querySelectorAll('[data-k]').forEach(btn=>{
    btn.onclick=()=>{selectedK=btn.dataset.k;document.getElementById('fh_k').value=selectedK;hideCatForm();renderChips()};
    let t;btn.addEventListener('touchstart',()=>{t=setTimeout(()=>openManage(),500)},{passive:true});
    btn.addEventListener('touchend',()=>clearTimeout(t));
    btn.addEventListener('touchmove',()=>clearTimeout(t));
    btn.addEventListener('contextmenu',e=>{e.preventDefault();openManage()});
  });
  document.getElementById('chipAdd').onclick=()=>{editingCatId=null;showCatForm()};
}
function showCatForm(pre){
  catForm.classList.add('open');
  document.getElementById('catNome').value=pre?.nome||'';
  pickCor=pre?.cor||SWATCHES[Math.floor(Math.random()*SWATCHES.length)];
  pickEmoji=pre?.emoji||'⭐';
  editingCatId=pre?.id||null;
  renderSwatches();renderEmojis();
  document.getElementById('catNome').focus();catForm.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function hideCatForm(){catForm.classList.remove('open');editingCatId=null}
function renderSwatches(){
  document.getElementById('swatches').innerHTML=SWATCHES.map(c=>`<button type="button" class="sw ${c===pickCor?'on':''}" style="background:${c}" data-c="${c}"></button>`).join('');
  document.getElementById('swatches').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;pickCor=b.dataset.c;renderSwatches()};
}
function renderEmojis(){
  document.getElementById('emojis').innerHTML=EMOJIS.map(e=>`<button type="button" class="${e===pickEmoji?'on':''}" data-e="${e}">${e}</button>`).join('');
  document.getElementById('emojis').onclick=e=>{const b=e.target.closest('[data-e]');if(!b)return;pickEmoji=b.dataset.e;renderEmojis()};
}
document.getElementById('catCancel').onclick=()=>hideCatForm();
document.getElementById('catSave').onclick=()=>{
  const nome=document.getElementById('catNome').value.trim();
  if(!nome){document.getElementById('catNome').focus();return}
  if(editingCatId){
    const c=catById(editingCatId);if(c){c.nome=nome;c.cor=pickCor;c.emoji=pickEmoji}
  }else{
    let id=slug(nome);if(catById(id))id=id+'_'+Date.now().toString(36).slice(-4);
    cats.push({id,nome,cor:pickCor,emoji:pickEmoji,def:false});
    selectedK=id;document.getElementById('fh_k').value=id;
  }
  saveCats(cats);hideCatForm();renderChips();renderLegend();renderCatList();
};

function openSheet(el,b){el.classList.add('open');b.classList.add('open');document.body.style.overflow='hidden'}
function closeSheet(el,b){el.classList.remove('open');b.classList.remove('open');if(!sheet.classList.contains('open')&&!sheetCat.classList.contains('open'))document.body.style.overflow=''}

function openF(i){
  editing=i;hideCatForm();
  const s=i==null?{h:'',t:'',d:'',k:'vendas'}:list[i];
  F.h.value=s.h||'';F.t.value=s.t||'';F.d.value=s.d||'';
  selectedK=norm(s.k)||'vendas';
  // if category missing (deleted), keep id but color falls back
  document.getElementById('fh_k').value=selectedK;
  document.getElementById('fh').textContent=i==null?'Nova parada':'Editar parada';
  document.getElementById('del').hidden=i==null;
  renderChips();
  openSheet(sheet,bd);
  setTimeout(()=>F.t.focus(),280);
}
function closeF(){closeSheet(sheet,bd)}

document.getElementById('add').onclick=()=>openF(null);
document.getElementById('can').onclick=()=>closeF();
bd.onclick=()=>closeF();
document.getElementById('del').onclick=()=>{if(confirm('Excluir esta parada?')){list.splice(editing,1);save(day,list);closeF();render()}};
F.onsubmit=e=>{
  e.preventDefault();
  const v={h:F.h.value,t:F.t.value.trim(),d:F.d.value.trim(),k:document.getElementById('fh_k').value||selectedK};
  if(!v.t){F.t.focus();return}
  if(editing==null)list.push({...v,id:v.h+'|'+v.t+'|'+Date.now(),done:false});
  else Object.assign(list[editing],v);
  save(day,list);closeF();render();
};

function renderCatList(){
  document.getElementById('catList').innerHTML=cats.map(c=>`<div class="cat-item" data-id="${c.id}">
    <span class="dotc" style="background:${c.cor}"></span>
    <span class="name">${c.emoji?c.emoji+' ':''}${esc(c.nome)}</span>
    ${c.def?'<span class="tag">padrão</span>':''}
    <button type="button" data-edit="${c.id}">Editar</button>
    ${c.def?'':'<button type="button" class="del" data-del="'+c.id+'">Excluir</button>'}
  </div>`).join('');
  document.getElementById('catList').onclick=e=>{
    const ed=e.target.closest('[data-edit]');
    const del=e.target.closest('[data-del]');
    if(ed){const c=catById(ed.dataset.edit);closeManage();openF(editing);showCatForm(c);return}
    if(del){
      if(!confirm('Excluir categoria "'+(catById(del.dataset.del)?.nome||'')+'"? Paradas dela ficam cinza.'))return;
      cats=cats.filter(c=>c.id!==del.dataset.del);
      saveCats(cats);if(selectedK===del.dataset.del){selectedK='vendas';document.getElementById('fh_k').value=selectedK}
      renderCatList();renderChips();renderLegend();render();
    }
  };
}
function openManage(){renderCatList();openSheet(sheetCat,bd2)}
function closeManage(){closeSheet(sheetCat,bd2)}
document.getElementById('btnManage').onclick=()=>openManage();
document.getElementById('catClose').onclick=()=>closeManage();
bd2.onclick=()=>closeManage();
document.getElementById('catAddFromManage').onclick=()=>{closeManage();editingCatId=null;if(!sheet.classList.contains('open'))openF(editing);showCatForm()};

const sh=n=>{const d=new Date(day+'T12:00');d.setDate(d.getDate()+n);day=iso(d);render();scrollTo(0,0)};
document.getElementById('prev').onclick=()=>sh(-1);document.getElementById('nxt').onclick=()=>sh(1);addEventListener('resize',trail);
render();

document.getElementById('mf').href='manifest.json';
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
